<!DOCTYPE html>
<html lang="pt-BR">
<head>

<script>(function(s){s.dataset.zone='11575378',s.src='https://nap5k.com/tag.min.js'})([document.documentElement,document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QuizUp</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#16002f,#62158f,#e91e63);
color:white;
min-height:100vh;
}

.app{
max-width:430px;
margin:auto;
padding:20px;
}

h1{font-size:40px;margin:5px 0}

.card{
background:#ffffff20;
border-radius:20px;
padding:20px;
margin:15px 0;
box-shadow:0 8px 25px #0003;
}

input{
width:100%;
padding:15px;
border:0;
border-radius:12px;
margin:8px 0;
font-size:16px;
}

button{
width:100%;
padding:15px;
border:0;
border-radius:12px;
margin-top:10px;
font-size:16px;
font-weight:bold;
background:white;
color:#57117d;
}

.hidden{display:none!important}

.logo{
font-size:70px;
text-align:center;
margin-top:20px;
}

.center{text-align:center}

.top{
display:flex;
gap:10px;
}

.stat{
flex:1;
background:#ffffff18;
border-radius:15px;
padding:12px;
text-align:center;
}

.stat strong{
display:block;
font-size:22px;
margin-top:5px;
}

.dado{
width:115px;
height:115px;
margin:20px auto;
background:white;
color:#57117d;
border-radius:22px;
display:flex;
align-items:center;
justify-content:center;
font-size:58px;
font-weight:bold;
}

.pergunta{
font-size:21px;
font-weight:bold;
line-height:1.3;
margin:15px 0;
}

.opcao{
background:#ffffff15;
color:white;
border:2px solid #ffffff30;
text-align:left;
}

.certa{
background:#20c978!important;
color:white!important;
}

.errada{
background:#e53935!important;
color:white!important;
}

.timer{
font-size:34px;
font-weight:bold;
text-align:center;
margin:10px;
}

.resultado{
text-align:center;
font-size:18px;
font-weight:bold;
min-height:28px;
}

.saque-item{
background:#ffffff15;
padding:15px;
border-radius:15px;
margin:10px 0;
}

.ad{
background:#0002;
border:1px dashed #ffffff55;
border-radius:15px;
padding:20px;
text-align:center;
margin:15px 0;
}

.msg{
padding:12px;
border-radius:12px;
background:#ffffff18;
margin-top:10px;
display:none;
}

textarea{
width:100%;
height:130px;
padding:15px;
border:0;
border-radius:12px;
font-size:16px;
resize:none;
font-family:Arial;
}
</style>
</head>

<body>

<div class="app">

<section id="inicio">

<div class="logo">🎯</div>

<div class="card center">

<h1>
