<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QuizUp</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#16002f,#62158f,#e91e63);
color:white;
min-height:100vh;
}

.app{
max-width:430px;
margin:auto;
padding:20px;
}

h1{font-size:40px;margin:5px 0}

.card{
background:#ffffff20;
border-radius:20px;
padding:20px;
margin:15px 0;
}

input{
width:100%;
padding:14px;
margin:7px 0;
border:0;
border-radius:12px;
font-size:16px;
}

button{cursor:pointer}

.principal{
width:100%;
padding:15px;
border:0;
border-radius:13px;
margin-top:8px;
font-weight:bold;
font-size:17px;
background:#ffd166;
color:#351052;
}

.secundario{
width:100%;
padding:13px;
border:0;
border-radius:13px;
margin-top:8px;
font-weight:bold;
background:#06d6a0;
color:#102a24;
}

.escondido{
display:none!important;
}

.login{
text-align:center;
padding-top:35px;
}

.logo{
font-size:65px;
}

.menu{
display:grid;
grid-template-columns:1fr 1fr;
gap:7px;
margin-bottom:15px;
}

.menu button{
padding:12px 5px;
border:0;
border-radius:12px;
background:#ffffff22;
color:white;
font-weight:bold;
}

.placar{
display:flex;
gap:10px;
}

.placar div{
flex:1;
text-align:center;
background:#ffffff15;
padding:12px;
border-radius:15px;
}

.numero{
display:block;
font-size:27px;
font-weight:bold;
margin-top:5px;
}

.dado-area{
text-align:center;
padding:10px;
}

.dado{
width:120px;
height:120px;
margin:20px auto;
background:white;
color:#541477;
border-radius:25px;
display:flex;
align-items:center;
justify-content:center;
font-size:58px;
font-weight:bold;
box-shadow:0 10px 25px #0005;
}

.timer{
font-size:35px;
font-weight:bold;
margin:10px;
}

.pergunta{
font-size:21px;
line-height:1.35;
text-align:center;
margin:15px 0;
}

.resposta{
width:100%;
padding:14px;
margin:6px 0;
border:2px solid #ffffff40;
border-radius:12px;
background:#ffffff15;
color:white;
font-size:16px;
font-weight:bold;
text-align:left;
}

.resposta:disabled{
opacity:1;
}

.verde{
background:#06d6a0!important;
color:#092b22;
}

.vermelho{
background:#ef476f!important;
}

.anuncio{
background:white;
color:#333;
padding:18px;
border-radius:15px;
text-align:center;
margin-top:15px;
}

.saque{
background:#ffffff12;
border-radius:13px;
padding:12px;
margin:8px 0;
}

.mensagem{
text-align:center;
font-weight:bold;
margin-top:12px;
}

footer{
text-align:center;
opacity:.6;
font-size:12px;
padding:20px;
}
</style>
</head>

<body>

<div class="app">

<!-- INÍCIO -->

<section id="inicio" class="login">

<div class="logo">🎯</div>

<h1>QuizUp</h1>

<p>Gire. Responda. Pontue!</p>

<div class="card">

<h2>👋 Bem-vindo!</h2>

<button type="button" class="principal" id="botaoCriar">
🆕 CRIAR CONTA
</button>

<button type="button" class="secundario" id="botaoLogin">
🔐 JÁ TENHO UMA CONTA
</button>

</div>

</section>


<!-- CADASTRO -->

<section id="cadastro" class="login escondido">

<div class="logo">📝</div>

<h1>Criar conta</h1>

<div class="card">

<input id="nome" type="text" placeholder="Nome completo">

<input id="cpf" type="text" inputmode="numeric" maxlength="14" placeholder="CPF">

<input id="emailCadastro" type="email" placeholder="Seu e-mail">

<input id="senhaCadastro" type="password" placeholder="Crie uma senha">

<button type="button" class="principal" id="confirmarCadastro">
🆕 CRIAR CONTA
</button>

<button type="button" class="secundario" id="voltarCadastro">
⬅️ VOLTAR
</button>

<p id="cadastroMsg"></p>

</div>

</section>


<!-- LOGIN -->

<section id="login" class="login escondido">

<div class="logo">🔐</div>

<h1>Entrar</h1>

<div class="card">

<input id="emailLogin" type="email" placeholder="Seu e-mail">

<input id="senhaLogin" type="password" placeholder="Sua senha">

<button type="button" class="principal" id="confirmarLogin">
🔐 ENTRAR
</button>

<button type="button" class="secundario" id="botaoEsqueci">
🔑 ESQUECI MINHA SENHA
</button>

<button type="button" class="secundario" id="voltarLogin">
⬅️ VOLTAR
</button>

<p id="loginMsg"></p>

</
